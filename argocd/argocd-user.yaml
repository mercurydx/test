apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  # Создаём пользователя с именем "developer"
  # "login" - разрешаем вход через GUI
  # "apiKey" - разрешаем использовать API (для CLI)
  accounts.developer: login, apiKey