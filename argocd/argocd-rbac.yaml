apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-rbac-cm
    app.kubernetes.io/part-of: argocd
data:
  policy.csv: |
    # Привязываем пользователя developer к роли role:developer
    g, developer, role:developer
    
    # === Приложения (Applications) ===
    p, role:developer, applications, get, */*, allow
    p, role:developer, applications, sync, */*, allow
    p, role:developer, applications, create, */*, allow
    p, role:developer, applications, update, */*, allow
    p, role:developer, applications, delete, */*, allow
    p, role:developer, applications, action/*, */*, allow
    p, role:developer, applications, override, */*, allow
    p, role:developer, logs, get, */*, allow
    
    # === Репозитории (Repositories) ===
    p, role:developer, repositories, get, *, allow
    p, role:developer, repositories, create, *, allow
    
    # === Проекты (AppProjects) 👈 ДОБАВЛЕНО ===
    p, role:developer, projects, get, *, allow
    p, role:developer, projects, create, *, allow
    p, role:developer, projects, update, *, allow
    p, role:developer, projects, delete, *, allow
    
  # Права по умолчанию для всех остальных (только чтение)
  policy.default: role:readonly