apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: system-utils
  namespace: argocd
spec:
  description: My utility projects
  
  # Разрешенные источники репозиториев
  sourceRepos:
    - 'https://github.com/mercurydx/test.git'
    - 'oci://registry-1.docker.io/bitnamicharts'
    - 'https://github.com/bitnami/charts.git'
  
  # Куда можно деплоить ресурсы
  destinations:
    - server: 'https://kubernetes.default.svc'
      # ВАЖНО: Здесь должно быть 'namespace' (единственное число) со звездочкой,
      # либо массив namespaces, но зависит от версии CRD. 
      # Самый безопасный способ для '*' — часто используется просто строка или пустой массив если все разрешены по умолчанию, 
      # но явный запрет лучше. Попробуем стандартный вид:
      namespace: '*' 

  # Разрешение конкретных типов ресурсов в указанных неймспейсах
  # Если оставить пустым [], то разрешено ВСЕ. 
  # Но мы явно перечислим то, что нужно Postgres и Helm:
  # Неважно, что здесь было раньше — схема работает так:
  # если Whitelist ПУСТОЙ или не задан, разрешены ВСЕ ресурсы (default allow-all).
  # Ограничения делаются через Blacklist, а не Whitelist.
  clusterResourceWhitelist: []

  # Позволяем создавать ресурсы из того же namespace argocd (для apps-in-any-namespace)
  sourceNamespaces:
    - argocd

  # Запрещаем только опасные глобальные вещи, остальное разрешено
  # (включая NetworkPolicy, ServiceAccount, Ingress и т.д.)
  clusterResourceBlacklist:
    - group: ''
      kind: ResourceQuota
    - group: apiregistration.k8s.io
      kind: APIService
  namespaceResourceBlacklist: []