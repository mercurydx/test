apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-go-ingress
  namespace: my-namespace  # <-- ДОБАВЬ ЭТУ СТРОКУ
spec:
  ingressClassName: nginx
  rules:
  - host: myapp.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: my-app-service
            port:
              number: 80