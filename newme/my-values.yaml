fullnameOverride: "art"
application:
  reloader: true
  podAnnotations:   {}
  imagePullSecrets: []
  probes:
    readinessProbe:
      httpGet:
        path: /index.html
        port: http
      initialDelaySeconds: 5
      periodSeconds: 15
    livenessProbe:
      httpGet:
        path: /index.html
        port: http
      initialDelaySeconds: 5
      periodSeconds: 15
      timeoutSeconds: 5  
  resources:
    limits:
      cpu: "0.2"
      memory: "400Mi"
    requests:
      cpu: "0.1"
      memory: "200Mi"

service:
  name: proxy 
  type: NodePort
  nodePort: 32002

    #- name: MySecret
    #prometheus.io/scrape: "true"
    #prometheus.io/path: "/metrics"  
    #prometheus.io/port: "80"#
ingress:
  enabled: true
  className: "nginx"
  annotations:
    certmanager.k8s.io/cluster-issuer: monitoring-issuer
  hosts:
    - host: "application.kryukov.local"
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: chart-example-tls
    #   hosts:
    #     - chart-example.local