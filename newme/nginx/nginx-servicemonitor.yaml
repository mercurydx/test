apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nginx-ingress-monitor
  namespace: ingress-nginx
  labels:
    # Этот лейбл важен! Prometheus из kube-prometheus-stack 
    # по умолчанию выбирает ServiceMonitor'ы с этим лейблом.
    release: prometheus-operator 
spec:
  selector:
    matchLabels:
      # Ищем наш новый сервис по уникальному лейблу
      k8s-app: nginx-ingress-metrics
      
  endpoints:
  - port: metrics       # Имя порта из нашего Service выше
    path: /metrics      # Путь эндпоинта
    interval: 30s       # Как часто собирать метрики
    scrapeTimeout: 10s