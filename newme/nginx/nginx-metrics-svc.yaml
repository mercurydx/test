apiVersion: v1
kind: Service
metadata:
  name: nginx-ingress-controller-metrics
  namespace: ingress-nginx
  labels:
    # Эти лейблы помогут ServiceMonitor найти именно этот сервис
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/instance: ingress-nginx
    app.kubernetes.io/component: controller
    k8s-app: nginx-ingress-metrics # Уникальный лейбл для фильтрации
spec:
  type: ClusterIP
  ports:
  - name: metrics      # Имя порта, которое мы укажем в ServiceMonitor
    port: 10254        # Порт сервиса
    targetPort: 10254  # Порт внутри пода (Nginx слушает тут метрики)
    protocol: TCP
  selector:
    # Находим поды контроллера по их лейблам
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/instance: ingress-nginx
    app.kubernetes.io/component: controller