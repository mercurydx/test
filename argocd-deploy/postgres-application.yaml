apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgresql
  namespace: argocd
spec:
  project: system-utils
  
  source:
    # ИСПОЛЬЗУЕМ GIT-РЕПОЗИТОРИЙ BITNAMI
    repoURL: https://github.com/mercurydx/test.git
    # ПУТЬ К ЧАРТУ ВНУТРИ РЕПО
    path: argocd-deploy/charts/bitnami/postgresql
    # ВЕТКА ИЛИ ТЕГ. 
    # Лучше использовать тег, чтобы зафиксировать версию.
    # Например, tag "postgresql-15.5.0" соответствует версии чарта 15.5.0
    targetRevision: main 
    helm:
      values: |
        auth:
          enablePostgresUser: true
          database: "myappdb"
          username: "myuser"
          
          existingSecret: "postgres-credentials"
          
        primary:
          persistence:
            enabled: true
            size: 5Gi
            storageClass: "" 
            
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
              
          podAntiAffinityPreset: soft 

        metrics:
          enabled: true
          service:
            type: ClusterIP
            port: 9187
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi

        service:
          type: ClusterIP
          ports:
            postgresql: 5432

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: databases
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true