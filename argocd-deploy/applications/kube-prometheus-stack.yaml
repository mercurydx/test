apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: system-utils
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    # Пин к последнему релизу в helm-репо (helm-репо не понимает branch 'main')
    targetRevision: 92.16.1
    helm:
      values: |
        alertmanager:
          enabled: false
        grafana:
          admin:
            # Пароль берём из секрета grafana-admin-credentials (applications/grafana-admin-secret.yaml)
            existingSecret: grafana-admin-credentials
            userKey: admin-user
            passwordKey: admin-password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
        prometheus:
          prometheusSpec:
            retention: 10d
            # Поднимать ServiceMonitor/PodMonitor из чужих чартов (bitnami postgres, postgres-exporter)
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            resources:
              requests:
                cpu: 200m
                memory: 1Gi
              limits:
                cpu: "1"
                memory: 2Gi
            storageSpec:
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 10Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true   # важно для CRD (ServiceMonitor и др.)