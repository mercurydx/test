apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app-of-apps
  namespace: argocd
spec:
  project: system-utils
  source:
    repoURL: https://github.com/mercurydx/test.git # Ваш репо
    targetRevision: main # Ваша ветка
    path: argocd-deploy/applications # Папка, где лежат другие application.yaml файлы
    
    directory:
      recurse: true # Искать во всех подпапках внутри apps/
      # Не генерировать Application из самого root-app.yaml
      exclude: 'root-app.yaml'
      
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true